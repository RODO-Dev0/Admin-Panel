function rawReq(path,o={}){const h={apikey:KEY,...(o.headers||{})};if(SES)h.Authorization='Bearer '+SES.access_token;
 let body;if(o.body instanceof Blob)body=o.body;else if(o.body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.body)}
 return fetch(SB+path,{method:o.method||'GET',headers:h,body})}
async function sb(path,o={}){
 await ensureFresh();if(!SES)throw new Error('Signed out');
 let r=await rawReq(path,o);if(r.status===401){if(await refresh())r=await rawReq(path,o)}
 if(!r.ok){let m='Request failed ('+r.status+')';try{const j=await r.json();m=j.message||j.msg||j.error_description||m}catch(e){}throw new Error(m)}
 if(r.status===204)return null;const tx=await r.text();return tx?JSON.parse(tx):null}
const insert=(t,b)=>sb('/rest/v1/'+t,{method:'POST',body:b,headers:PR});
const patch=(t,col,val,b)=>sb(`/rest/v1/${t}?${col}=eq.${enc(val)}`,{method:'PATCH',body:b,headers:PR});
const remove=(t,col,val)=>sb(`/rest/v1/${t}?${col}=eq.${enc(val)}`,{method:'DELETE'});
async function logAct(action,detail=''){try{await sb('/rest/v1/hotel_logs',{method:'POST',body:{actor:SES?.user?.email||'admin',action,detail:String(detail).slice(0,300)}})}catch(e){}}

/* ---------- ui helpers ---------- */
function toast(m,bad){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),bad?4200:2400)}
function ask(title,text,ok='Delete',danger=true){return new Promise(res=>{const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="meta" style="margin:8px 0 18px">${esc(text)}</p><div class="acts"><button class="btn ${danger?'danger':''}" data-y style="flex:1">${esc(ok)}</button><button class="btn ghost" data-n style="flex:1">Cancel</button></div></div>`;
 document.body.append(ov);const done=v=>{ov.remove();res(v)};ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-n]'))done(false);if(e.target.closest('[data-y]'))done(true)})})}
const fmt=d=>new Date(d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const money=n=>(DB?.settings?.currency||'$')+Number(n).toLocaleString();
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function normPhone(p){let d=String(p).replace(/\D/g,'');if(d.startsWith('00964'))d=d.slice(5);else if(d.startsWith('964'))d=d.slice(3);if(d.length===10&&d[0]==='7')d='0'+d;return /^07[3-9]\d{8}$/.test(d)?d:null}
const isExp=b=>b.status==='pending'&&Date.now()-new Date(b.created_at)>DB.settings.hold_hours*36e5;
const pendingList=()=>DB.bookings.filter(b=>b.status==='pending'&&!isExp(b));
function flagsOf(b){const f=[];if(DB.bookings.filter(x=>x.phone===b.phone).length>=3)f.push('Repeat number');if(b.form_secs!=null&&b.form_secs<10)f.push('Filled very fast');
 if(DB.bookings.some(x=>x.id!==b.id&&x.guest_name.toLowerCase()===b.guest_name.toLowerCase()&&x.phone!==b.phone))f.push('Same name, other number');return f}
function csv(name,rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl(name,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function renderLogin(msg=''){
 $('#app').innerHTML=`<div class="center"><div class="modal"><div class="brandrow">${ico('lock')}<h3>Admin</h3></div>
 <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></div>
 <div class="f"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
 <div class="err" id="le" role="alert">${esc(msg)}</div><button class="btn" id="go" style="width:100%">Sign in</button></div></div>`;
 const go=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;const le=$('#le'),b=$('#go');if(!email||!password){le.textContent='Enter your email and password.';return}
  b.disabled=true;le.textContent='';
  try{const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
   const j=await r.json();if(!r.ok)throw new Error(r.status===400?'Wrong email or password.':(j.msg||j.message||'Could not sign in.'));
   setSession(j);await start()}catch(e){le.textContent=e.message;b.disabled=false}};
 $('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
async function start(){
 try{const a=await sb('/rest/v1/hotel_admins?select=user_id');
  if(!a||!a.length){clearSession();renderLogin('This account is not an administrator of this website.');return}
  await loadAll();shell()}catch(e){if(SES){toast(e.message,true);renderLogin('Could not load data: '+e.message)}}}

function collect(card){const o={};$$('[data-f]',card).forEach(el=>{const k=el.dataset.f;o[k]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value.trim()});return o}
function validate(t,o){
 const T=/^([01]\d|2[0-3]):[0-5]\d$/,int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
 if(t==='hotel_rooms'){if(!o.name)return 'Room name is required.';if(!(o.price>=0))return 'Enter a valid price.';if(!int(o.units,0,9999))return 'Rooms of this type must be a whole number.';if(!int(o.capacity,1,20))return 'Max guests must be 1 to 20.'}
 if(t==='hotel_cards'&&!o.title)return 'Card name is required.';
 if(t==='hotel_reviews'&&(!o.name||!o.body))return 'Name and review text are required.';
 if(t==='hotel_legal_pages'&&(!o.title||!o.body))return 'Title and text are required.';
 if(t==='hotel_settings'){
  if('name'in o&&!o.name)return 'Hotel name is required.';
  if(o.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))return 'Enter a valid email address.';
  if(o.whatsapp&&!/^\d{8,15}$/.test(o.whatsapp))return 'WhatsApp number: digits only, 8 to 15, with country code.';
  if('checkin_time'in o&&!T.test(o.checkin_time))return 'Enter a valid check-in time.';
  if('checkout_time'in o&&!T.test(o.checkout_time))return 'Enter a valid check-out time.';
  if('hold_hours'in o&&!int(o.hold_hours,1,168))return 'Hold time must be 1 to 168 hours.';
  if('max_nights'in o&&!int(o.max_nights,1,365))return 'Longest stay must be 1 to 365 nights.';
  if('stars'in o&&!int(o.stars,0,5))return 'Star rating must be 0 to 5.';
  if('currency'in o&&!o.currency)return 'Currency symbol is required.'}
 return ''}
async function saveRow(btn){
 const card=btn.closest('.rowcard'),t=card.dataset.t,o=collect(card);
 if('position'in o&&o.position===null)o.position=0;
 const m=validate(t,o);if(m){toast(m,true);return}
 btn.disabled=true;btn.textContent='Saving…';
 try{let rows,key;
  if(t==='hotel_settings'){rows=await patch(t,'id',1,o);if(rows?.length)Object.assign(DB.settings,rows[0])}
  else if(t==='hotel_legal_pages'){o.updated_at=new Date().toISOString();rows=await sb(`/rest/v1/hotel_legal_pages?slug=eq.${enc(card.dataset.slug)}&lang=eq.en`,{method:'PATCH',body:o,headers:PR});
   if(rows?.length){const i=DB.legal.findIndex(x=>x.slug===card.dataset.slug);DB.legal[i]=rows[0];const r2=await patch('hotel_settings','id',1,{legal_version:today()});if(r2?.length)Object.assign(DB.settings,r2[0])}}
  else{rows=await patch(t,'id',card.dataset.id,o);if(rows?.length){const L=DB[LIST[t]],i=L.findIndex(x=>x.id===card.dataset.id);L[i]=rows[0]}}
  if(!rows||!rows.length)throw new Error('Not saved. You may not have permission.');
  await logAct('Edited '+LABEL[t].toLowerCase(),Object.keys(o).join(', ')+(o.name?' · '+o.name:o.title?' · '+o.title:''));
  card.classList.remove('dirty');btn.textContent='Save';toast('Saved');
  if(t==='hotel_settings'){$$('#bn1,#bn2').forEach(e=>e.textContent=DB.settings.name)}
  if(['hotel_rooms','hotel_cards','hotel_reviews'].includes(t))keepScroll(renderMain);
 }catch(e){toast(e.message,true);btn.disabled=false;btn.textContent='Save'}}

/* ---------- images ---------- */
function shrink(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
 i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Could not process the image.')),'image/jpeg',.84)};
 i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Your browser cannot read this image type. Use JPG or PNG.'))};i.src=u})}
async function uploadImage(file,folder){
 if(!file.type.startsWith('image/'))throw new Error('Choose an image file.');
 if(file.size>25*1024*1024)throw new Error('This image is too large (25 MB maximum).');
 const blob=await shrink(file,1800);if(blob.size>5*1024*1024)throw new Error('Image is still over 5 MB after compression. Try a smaller photo.');
 await ensureFresh();const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
 const r=await fetch(`${SB}/storage/v1/object/hotel-media/${path}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+SES.access_token,'Content-Type':'image/jpeg','x-upsert':'false'},body:blob});
 if(!r.ok){let m='Upload failed';try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}
 return `${SB}/storage/v1/object/public/hotel-media/${path}`}
const TBL={rooms:'hotel_rooms',gallery:'hotel_gallery',settings:'hotel_settings'};
async function handleFiles(dz,files){
 const [kind,id,field]=dz.dataset.dz.split('|');if(!files.length)return;dz.classList.add('busy');
 try{
  if(kind==='gallery'&&id==='new'){let n=0;for(const f of files){const url=await uploadImage(f,'gallery');const rows=await insert('hotel_gallery',{image_url:url,position:DB.gal.length+1});DB.gal.push(rows[0]);n++}
   await logAct('Added gallery photos',String(n));toast(n+' photo'+(n>1?'s':'')+' added');keepScroll(renderMain);return}
  const url=await uploadImage(files[0],kind==='settings'?'site':kind);const t=TBL[kind];
  const rows=await patch(t,'id',id,{[field]:url});if(!rows?.length)throw new Error('Not saved. You may not have permission.');
  if(kind==='settings')DB.settings[field]=url;else{const L=kind==='rooms'?DB.rooms:DB.gal,i=L.findIndex(x=>x.id===id);if(i>-1)L[i][field]=url}
  $('.pv',dz).innerHTML=`<img src="${esc(url)}" alt="">`;await logAct('Changed image',kind+' '+(kind==='settings'?field:''));toast('Image saved')
 }catch(e){toast(e.message,true)}finally{dz.classList.remove('busy')}}

/* ---------- actions ---------- */
async function setStatus(id,status){
 const b=DB.bookings.find(x=>x.id===id);if(!b||b.status===status)return;const old=b.status;
 try{const rows=await patch('hotel_bookings','id',id,{status});if(!rows?.length)throw new Error('Not saved.');b.status=status;await logAct('Booking status',`${b.ref}: ${old} → ${status}`);toast('Status updated');keepScroll(renderMain)}
 catch(e){toast(e.message,true);keepScroll(renderMain)}}
async function blockPhone(phone,reason){
 await sb('/rest/v1/hotel_blocked_phones',{method:'POST',body:{phone,reason},headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}});
 await sb(`/rest/v1/hotel_bookings?phone=eq.${enc(phone)}&status=eq.pending`,{method:'PATCH',body:{status:'cancelled'},headers:{Prefer:'return=minimal'}});
 DB.bookings.forEach(b=>{if(b.phone===phone&&b.status==='pending')b.status='cancelled'});
 DB.blocked=await sb('/rest/v1/hotel_blocked_phones?select=*&order=created_at.desc');await logAct('Blocked number',phone)}
async function act(a){
 const act=a.dataset.act;
 try{
 if(act==='reload'){a.disabled=true;await loadAll();renderMain();toast('Updated');a.disabled=false}
 else if(act==='signout')signOut();
 else if(act==='more'){const ov=document.createElement('div');ov.className='sheetov';
  ov.innerHTML=`<div class="sheet">${TABS.filter(t=>!MOBILE_MAIN.includes(t[0])).map(([k,l,i])=>`<button class="it" data-go="${k}">${ico(i)}${l}</button>`).join('')}<hr><button class="it" data-act="reload">${ico('refresh')}Refresh</button><button class="it" data-act="signout">${ico('out')}Sign out</button><div class="meta" style="padding:8px 12px">${esc(SES.user?.email||'')}</div></div>`;
  document.body.append(ov);ov.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){tab=g.dataset.go;ov.remove();renderMain();scrollTo(0,0)}else if(e.target===ov||e.target.closest('[data-act]'))ov.remove()})}
 else if(act==='save-row')saveRow(a);
 else if(act==='add-room'){const r=await insert('hotel_rooms',{name:'New room',price:80,units:1,capacity:2,position:DB.rooms.length+1,description:''});DB.rooms.push(r[0]);await logAct('Added room','');renderMain()}
 else if(act==='add-card'){const r=await insert('hotel_cards',{kind:a.dataset.kind,icon:'star',title:'New card',position:DB.cards.filter(c=>c.kind===a.dataset.kind).length+1});DB.cards.push(r[0]);await logAct('Added card',a.dataset.kind);renderMain()}
 else if(act==='add-review'){const r=await insert('hotel_reviews',{name:'Guest name',body:'Review text',position:DB.reviews.length+1});DB.reviews.push(r[0]);await logAct('Added review','');renderMain()}
 else if(act==='del-row'){const card=a.closest('.rowcard'),t=card.dataset.t,id=card.dataset.id;const L=DB[LIST[t]],it=L.find(x=>x.id===id);
  if(!await ask('Delete this item?',(it?.name||it?.title||'This item')+' will be removed from the website.'))return;
  await remove(t,'id',id);DB[LIST[t]]=L.filter(x=>x.id!==id);await logAct('Deleted '+LABEL[t].toLowerCase(),it?.name||it?.title||'');toast('Deleted');keepScroll(renderMain)}
 else if(act==='del-gal'){if(!await ask('Remove this photo?','It will disappear from the gallery.','Remove'))return;await remove('hotel_gallery','id',a.dataset.id);DB.gal=DB.gal.filter(x=>x.id!==a.dataset.id);await logAct('Removed gallery photo','');keepScroll(renderMain)}
 else if(act==='confirm-bk')setStatus(a.dataset.id,'confirmed');
 else if(act==='block-bk'){const b=DB.bookings.find(x=>x.id===a.dataset.id);if(!await ask('Block this number?',`${b.phone} will not be able to book online and its open requests will be cancelled.`,'Block'))return;await blockPhone(b.phone,'Blocked from booking '+b.ref);toast('Number blocked');keepScroll(renderMain)}
 else if(act==='del-bk'){const b=DB.bookings.find(x=>x.id===a.dataset.id);if(!await ask('Delete this booking?','This permanently deletes the guest\'s data. Use it for data deletion requests or spam.'))return;await remove('hotel_bookings','id',b.id);DB.bookings=DB.bookings.filter(x=>x.id!==b.id);await logAct('Deleted booking',b.ref);toast('Deleted');keepScroll(renderMain)}
 else if(act==='unblock'){await remove('hotel_blocked_phones','phone',a.dataset.phone);DB.blocked=DB.blocked.filter(x=>x.phone!==a.dataset.phone);await logAct('Unblocked number',a.dataset.phone);keepScroll(renderMain)}
 else if(act==='block-num'){const p=normPhone($('#bp').value);if(!p){toast('Enter a valid Iraqi mobile number.',true);return}await blockPhone(p,'Blocked by admin');toast('Number blocked');keepScroll(renderMain)}
 else if(act==='change-pw'){const a1=$('#np').value,a2=$('#np2').value;if(a1.length<10){toast('Use at least 10 characters.',true);return}if(a1!==a2){toast('The two passwords do not match.',true);return}
  await sb('/auth/v1/user',{method:'PUT',body:{password:a1}});await logAct('Changed password','');$('#np').value='';$('#np2').value='';toast('Password changed')}
 else if(act==='csv-bk')csv('bookings.csv',[['Reference','Created','Guest','Phone','Room','Check-in','Check-out','Guests','Total','Status','Note','Terms version']].concat(DB.bookings.map(b=>[b.ref,b.created_at,b.guest_name,b.phone,b.room_name,b.check_in,b.check_out,b.guests,b.total,b.status,b.note,b.consent_version])));
 else if(act==='csv-log')csv('activity-log.csv',[['Time','Who','Action','Detail']].concat(DB.logs.map(l=>[l.created_at,l.actor,l.action,l.detail])));
 else if(act==='backup'){dl('hotel-backup.json',JSON.stringify(DB,null,1),'application/json');await logAct('Downloaded backup','')}
 }catch(e){toast(e.message,true);if(a&&a.disabled)a.disabled=false}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;renderMain();scrollTo(0,0);return}
 const sb2=e.target.closest('[data-sub]');if(sb2){sub=sb2.dataset.sub;renderMain();return}
 const bfb=e.target.closest('[data-bf]');if(bfb){bf=bfb.dataset.bf;renderMain();return}
 const lfb=e.target.closest('[data-lf]');if(lfb){lf=lfb.dataset.lf;renderMain();return}
 const dzel=e.target.closest('.dz');if(dzel&&e.target.type!=='file'){$('input',dzel).click();return}
 const a=e.target.closest('[data-act]');if(a&&!a.closest('.sheet'))act(a)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('dz')){e.preventDefault();$('input',e.target).click()}});
function dirty(e){const c=e.target.closest?.('.rowcard');if(c&&e.target.matches('[data-f]')){c.classList.add('dirty');const b=$('[data-act=save-row]',c);if(b)b.disabled=false}}
document.addEventListener('input',e=>{dirty(e);if(e.target.id==='bq'){bq=e.target.value;$('#blist').innerHTML=bookingListHTML()}});
document.addEventListener('change',e=>{
 dirty(e);
 if(e.target.matches('select[data-f=icon]')){const p=e.target.closest('.f').querySelector('.iprev');if(p)p.firstElementChild.outerHTML=ico(e.target.value)}
 if(e.target.dataset.bs)setStatus(e.target.dataset.bs,e.target.value);
 const d=e.target.closest?.('.dz');if(d&&e.target.type==='file'){handleFiles(d,[...e.target.files]);e.target.value=''}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest?.('.dz');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop')handleFiles(d,[...e.dataTransfer.files])}));

/* ---------- live updates ---------- */
async function poll(){
 if(!SES||!DB||document.hidden)return;
 try{const [b,l]=await Promise.all([sb('/rest/v1/hotel_bookings?select=*&order=created_at.desc&limit=500'),sb('/rest/v1/hotel_logs?select=*&order=created_at.desc&limit=300')]);
  const before=pendingList().length;DB.bookings=b;DB.logs=l;const after=pendingList().length;markNav();if(after>before)toast('New booking request');
  const ae=document.activeElement;if(['dash','book','logs'].includes(tab)&&!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))keepScroll(renderMain)}catch(e){}}
setInterval(poll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

if(SES)start();else renderLogin();
